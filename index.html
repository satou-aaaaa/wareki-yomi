.ch.ng::after{content:"✕ ちがう";position:absolute;top:4px;right:8px;font-size:.8rem;font-weight:900;color:var(--shu2)}
.ch.ok{border-color:var(--ok);background:#eef7f0;box-shadow:0 5px 0 #25734a66}
.ch.ok::after{content:"✓ 正解";position:absolute;top:4px;right:8px;font-size:.8rem;font-weight:900;color:var(--ok2)}
.ch:disabled{cursor:default}

<script id="a11y-script">
/* 見やすさの設定（色覚・ディスレクシア・弱視・動きに弱い人のため）。外へは何も送らない。
   設定は localStorage の a11y-v1 に置く。同じサイト（satou-aaaaa.github.io）のゲームは同じ設定を使う。
   ゲームの側でできること：
   - 設定を開くボタンに data-a11y-open を付ける（無ければ左下に「Aa」のボタンを出す）
   - 読み上げる文に data-a11y-say を付ける（問題文・知らせなど）
   - 色の見分けを助ける形・模様は html.a11y-cvd の下に CSS で書く。JS では A11y.on('cvd')
   - 揺れ・すべる動きを JS で動かすときは、A11y.on('calm') なら止める
   - 設定が変わると document に a11ychange が届く
   - 設定の印は html の class「a11y-<設定の名前>」（a11y-read など）。部品の class はこれと重ならない名前にする（2026-11-05 a11y-say がボタンとぶつかった） */
(() => {

  const root = document.documentElement;
  const OPTS = [
    ["read", "読みやすい文字", "UD フォント・行間と字間を広く"],
    ["cvd", "色の見分けを助ける", "色に形・模様・記号を足す"],
    ["calm", "動きを減らす", "揺れ・点滅・すべる動きを止める"],
    ["say", "読み上げのボタンを出す", "問題や知らせを声で読む（端末の中の声だけ）"],
    ["ruby", "ふりがなを出す", "むずかしい漢字に読みを付ける"],

  const media = (q) => { try { return matchMedia(q).matches; } catch { return false; } };
  // 保存した値がオブジェクトでなければ（別のページが書いた・手で直した）無かったことにする（2026-11-05 CodeRabbit：true が入ると設定が開けなくなる）

    for (const [k] of OPTS) root.classList.toggle("a11y-" + k, on(k));
    if (on("read")) loadFont();
    if (sayBtn) sayBtn.hidden = !on("say");

    S = { ...S, ...load() }; // 別のタブで変えた設定を消さないよう、書く前に読み直す
    S[k] = !!v;

  const voice = () => { try { return speechSynthesis.getVoices().find((v) => /^ja/i.test(v.lang) && v.localService) || null; } catch { return null; } };

  const sayText = () => textOf("[data-a11y-say]") || textOf("h1,h2,[role=status],[aria-live]");
  const say = (text) => {
    const v = voice();
    if (!v || !text) return false;
    stop();
    const u = new SpeechSynthesisUtterance(text.slice(0, 600));
    u.voice = v; u.lang = v.lang; u.rate = 0.95;
    speechSynthesis.speak(u);

  const build = () => {
    dlg = document.createElement("dialog");
    dlg.className = "a11y-dlg";
    dlg.setAttribute("aria-labelledby", "a11y-h");
    const hasRuby = !!document.querySelector("ruby.a11y-rb");
    dlg.innerHTML = `<h2 id="a11y-h">見やすさ・読みやすさ</h2><p>ほかのゲームにも同じ設定が使われます。文字は2本の指で広げると大きくなります。</p>` +
      OPTS.filter(([k]) => k !== "ruby" || hasRuby).map(([k, n, d]) => `<label><input type="checkbox" data-k="${k}"><span>${n}<small>${d}</small></span></label>`).join("") +
      `<p class="a11y-note" id="a11y-novoice" hidden>この端末には、外へ送らずに読める日本語の声がありません。</p><div class="a11y-row"><button type="button" class="a11y-ok" data-a11y-close>閉じる</button></div>`;
    document.body.appendChild(dlg);
    dlg.addEventListener("change", (e) => {
      const k = e.target.dataset && e.target.dataset.k;
      if (!k) return;
      set(k, e.target.checked);
      if (k === "say") dlg.querySelector("#a11y-novoice").hidden = !(e.target.checked && !voice());
    });
    dlg.querySelector("[data-a11y-close]").addEventListener("click", () => dlg.close());
    dlg.addEventListener("close", () => { if (lastFocus && lastFocus.focus) lastFocus.focus(); });
    sayBtn = document.createElement("button");
    sayBtn.type = "button"; sayBtn.className = "a11y-saybtn"; sayBtn.textContent = "🔊 読む"; sayBtn.setAttribute("aria-label", "画面の問題を読み上げる");
    sayBtn.addEventListener("click", () => {
      try { if (speechSynthesis.speaking) return stop(); } catch { /* 無い端末 */ }
      if (!say(sayText())) open();
    });
    document.body.appendChild(sayBtn);
    if (!document.querySelector("[data-a11y-open]")) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "a11y-btn a11y-float"; b.textContent = "Aa"; b.setAttribute("data-a11y-open", ""); b.setAttribute("aria-label", "見やすさの設定");
      document.body.appendChild(b);
    }
    document.addEventListener("click", (e) => { const t = e.target.closest && e.target.closest("[data-a11y-open]"); if (t) { e.preventDefault(); open(); } });
    apply();
  };
  const open = () => {
    if (!dlg) build();
    lastFocus = document.activeElement;
    for (const c of dlg.querySelectorAll("input[data-k]")) c.checked = on(c.dataset.k);
    dlg.querySelector("#a11y-novoice").hidden = !(on("say") && !voice());
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", "");
  };
  // 声の一覧はあとから届くことがある。届いたら「声がありません」を出し直す
  try { speechSynthesis.addEventListener("voiceschanged", () => { if (dlg) dlg.querySelector("#a11y-novoice").hidden = !(on("say") && !voice()); }); } catch { /* 無い端末 */ }
  apply();

})();
</script>
<!-- a11y:end -->

<script>
"use strict";
const $ = (id) => document.getElementById(id), app = $("app");
const SITE = "https://satou-aaaaa.github.io/wareki-yomi/";
const FEEDBACK = "https://github.com/satou-aaaaa/wareki-yomi/issues/new?template=feedback.yml";
const KEY = "wareki-v1", FSKEY = "wareki-fs", EPOCH = "2026-11-07";
const G = window.WAREKI, LV = G.LV;

// ---- 文字の大きさ（この端末だけ。記録とは別に置く。はじめは「大きい」）----
function fsGet() { try { const v = +localStorage.getItem(FSKEY); return v >= 1 && v <= 3 ? v : 2; } catch (e) { return 2; } }

document.documentElement.classList.remove("fs1", "fs2", "fs3"); document.documentElement.classList.add("fs" + fsGet());

// ---- 日付（日本時間。だれでも同じ5問）----
const jstNow = () => new Date(Date.now() + 9 * 3600e3);
const todayKey = () => jstNow().toISOString().slice(0, 10);
const dayNo = (k) => Math.round((Date.parse(k) - Date.parse(EPOCH)) / 864e5) + 1;
const prevDay = (k) => new Date(Date.parse(k) - 864e5).toISOString().slice(0, 10);
const md = (k) => `${+k.slice(5, 7)}/${+k.slice(8, 10)}`;
const listOf = (mode, date) => (mode === "h" ? G.hardTags(date) : G.dailyTags(date));

// 今日のひとこと：和暦帳の「覚えること」を日ごとに1つ（くり返し思い出すと長く覚えている）
const TIPS = G.KINDS.map((k) => [k.name, k.note]);
const tipOf = (k) => TIPS[((dayNo(k) - 1) % TIPS.length + TIPS.length) % TIPS.length];

// ---- とことん：やさしい5 → ふつう10 → むずかしい（何問でも）を、毎回ちがう種で。まちがえても終わらず「ここで降りる」まで（乱数は練習ととことんだけ）----
const ERAMP = [[0, 5], [1, 10], [2, 85]];
const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
// 1回の中で同じ問題（場面・地図・答えが同じ）を出さない。作れる問題が尽きた種類だけは重なってよい（30回試す）
const keysOf = (list) => new Set(list.map((t) => G.keyOf(G.make(t))));
// 作れる問題が尽きた種類は、同じ難しさの別の種類に替える。全部尽きたときだけ重なってよい
function freshTag(id, salt, seen, alt = []) {
  for (const k2 of [id, ...alt.filter((x) => x !== id)]) for (let k = 0; k < 30; k++) { const t = `${k2}|${salt}${k ? "~" + k : ""}`, key = G.keyOf(G.make(t)); if (!seen.has(key)) { seen.add(key); return t; } }
  return `${id}|${salt}`;
}
function randomTags(lv, n, salt, seen = new Set(), only) {
  const ids = only ? [only] : G.kindsOf(lv), out = []; let prev = null;
  for (let i = 0; i < n; i++) { let id; do { id = ids[Math.floor(Math.random() * ids.length)]; } while (ids.length > 1 && id === prev); prev = id; out.push(freshTag(id, `${salt}:${i}`, seen, ids)); }
  return out;
}
function endlessList(salt) { const s = salt || rid(), out = [], seen = new Set(); for (const [lv, n] of ERAMP) out.push(...randomTags(lv, n, s + ":" + lv, seen)); return out; }
// 残りが少なくなったら、むずかしいを足して続ける（終わりにしない）
function moreList(run) {
  const ids = G.kindsOf(2), salt = run.id + ":m" + run.list.length, out = [];
  let prev = run.list[run.list.length - 1].split("|")[0];
  const seen = keysOf(run.list);
  for (let i = 0; i < 40; i++) { let j = G.seedOf(salt + ":" + i) % ids.length; if (ids[j] === prev) j = (j + 1) % ids.length; prev = ids[j]; const t = freshTag(prev, `${salt}:${i}`, seen, ids); prev = t.split("|")[0]; out.push(t); }
  return out;
}
const cleanOf = (run) => run.res.filter((x) => x.m === 0).length;
const starsOf = (m) => (m === 0 ? 3 : m === 1 ? 2 : 1); // m = まちがい＋ヒントの数
const starStr = (s) => `<span class="stars" aria-label="星${s}つ">${"★".repeat(s)}<span class="off">${"★".repeat(3 - s)}</span></span>`;

// ---- 記録（この端末の localStorage だけ）----
// days/hdays/adays：日付 → { m:[1問ごとのまちがい＋ヒント], k:[種類] }。adays はあとから遊んだ日（連続の日・今日の記録・Ko-fi には数えない）
// dex：種類 → 解いた数（和暦帳）。runs：モードごとの途中経過（練習で今日・上級の途中を消さない）
const fresh = () => ({ v: 1, days: {}, hdays: {}, adays: {}, dex: {}, runs: {}, tut: false, kofi: {}, ach: {}, ebest: 0 });
let MODE = "d";
let mem = null; // 保存できない環境では、開いているあいだだけここに置く
const doneOf = (r) => !!r && r.res.length >= r.list.length, recOf = (r) => ({ m: r.res.map((x) => x.m), k: r.list.map((t) => t.split("|")[0]) });
const runKey = (mode, date) => (mode === "a" ? "a:" + date : mode);
const bookOf = (s, m) => (m === "d" ? s.days : m === "h" ? s.hdays : m === "a" ? s.adays : null);
// 終わった回を日ごとの記録に入れる（結果を見る前に閉じても、別のタブが次の日を保存しても、終えた日を失わない）
function bank(s, r) { const b = doneOf(r) ? bookOf(s, r.mode) : null; if (!b || b[r.date] || (r.mode === "a" && s.days[r.date])) return false; b[r.date] = recOf(r); return true; }
// 保存に失敗したあとはメモリと保存の両方を読む。合わせる前に両方を fresh() で補う。数は高いほう、途中経過は同じ回なら進んだほう
function load() {
  let a = null, b = null;
  try { b = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  try { a = mem !== null ? JSON.parse(mem) : null; } catch (e) {}
  if (a && a.v !== 1) a = null; if (b && b.v !== 1) b = null;
  if (!a || !b) { const s = Object.assign(fresh(), a || b || {}); for (const q of ["days", "hdays", "adays", "dex", "runs", "kofi", "ach"]) if (!s[q] || typeof s[q] !== "object") s[q] = {}; return tidy(s); }
  a = Object.assign(fresh(), a); b = Object.assign(fresh(), b);
  const [n, o] = (a.t || 0) >= (b.t || 0) ? [a, b] : [b, a], s = Object.assign(fresh(), n);
  for (const k in o) {
    if (k === "runs" || k === "t") continue;
    const x = o[k], y = n[k];
    if (x && y && typeof x === "object" && typeof y === "object") { s[k] = Object.assign({}, x, y); for (const q in x) if (typeof x[q] === "number" && typeof y[q] === "number") s[k][q] = Math.max(x[q], y[q]); }
    else if (typeof x === "number" && typeof y === "number") s[k] = Math.max(x, y);
    else if (x === true) s[k] = true;
  }
  const ra = a.runs || {}, rb = b.runs || {}, prog = (r) => (r.res ? r.res.length : 0) * 1000 + (r.cur ? (r.cur.wrong || []).length * 10 + (r.cur.hints || 0) : 0);
  s.runs = Object.assign({}, n.runs);
  for (const m of new Set([...Object.keys(ra), ...Object.keys(rb)])) {
    const x = ra[m], y = rb[m];
    if (x === undefined || y === undefined) { if (x || y) s.runs[m] = x || y; continue; }
    if (!x || !y) { const r = x || y; if (!r || bank(s, r) || doneOf(r)) continue; const bd = bookOf(s, r.mode); if (bd && !bd[r.date]) s.runs[m] = r; continue; }
    if (x.id !== y.id && x.date !== y.date) { const [w, l] = x.date > y.date ? [x, y] : [y, x]; bank(s, l); s.runs[m] = w; }
    else if (x.id === y.id) { const px = prog(x), py = prog(y); s.runs[m] = px > py ? x : py > px ? y : n.runs[m]; }
  }
  return tidy(s);
}
// 引き継ぎコードなどから入った値を正しい形に直す（数の所に文字が入っていても画面に出さない）
const num = (v) => (Number.isFinite(+v) && +v >= 0 ? Math.floor(+v) : 0);
function tidy(s) {
  s.ebest = num(s.ebest);
  for (const q of ["days", "hdays", "adays", "dex", "runs", "kofi", "ach"]) if (!s[q] || typeof s[q] !== "object" || Array.isArray(s[q])) s[q] = {};
  for (const k in s.dex) s.dex[k] = num(s.dex[k]);
  // 日付と日ごとの記録の形も確かめ、壊れたものは捨てる（細工した引き継ぎコードで画面が止まらないように。2026-11-05 CodeRabbit）
  const okDate = (v) => { if (typeof v !== "string" || !/^\d{4}-\d\d-\d\d$/.test(v)) return false; const t = Date.parse(v + "T00:00:00Z"); return Number.isFinite(t) && new Date(t).toISOString().slice(0, 10) === v; }; // 2026-02-30 のような無い日も捨てる
  const okTag = (t) => typeof t === "string" && Object.prototype.hasOwnProperty.call(G.BY, t.split("|")[0]);
  const okRec = (x, n) => !!x && typeof x === "object" && Array.isArray(x.m) && x.m.length === n && x.m.every((v) => Number.isInteger(v) && v >= 0);
  for (const [b, n] of [[s.days, 5], [s.hdays, 3], [s.adays, 5]]) for (const d in b) if (!okDate(d) || !okRec(b[d], n)) delete b[d];
  for (const m in s.runs) {
    const r = s.runs[m]; if (r === null) continue;
    // 途中経過の入れ物の名前とモードが合わないもの（引き継ぎで入った「d に mode e」など）は捨てる
    if (typeof r !== "object" || !["d", "h", "e", "p", "a"].includes(r.mode) || !okDate(r.date) || runKey(r.mode, r.date) !== m || !Array.isArray(r.list) || !r.list.every(okTag) || !Array.isArray(r.res) || !r.res.every((x) => x && typeof x === "object" && Number.isInteger(x.m) && x.m >= 0)) { delete s.runs[m]; continue; }
    if (r.cur != null && (typeof r.cur !== "object" || !Array.isArray(r.cur.wrong))) r.cur = null; else if (r.cur) r.cur.hints = num(r.cur.hints);
    delete r.life; // 前の形の🌸は読まない
  }
  return s;
}
// 保存の前に読み直す（別のタブで進めた記録を消さない）
function save(fn) { const s = load(); fn(s); s.t = Math.max(Date.now(), (s.t || 0) + 1); const j = JSON.stringify(s); try { localStorage.setItem(KEY, j); mem = null; } catch (e) { mem = j; } return s; }
function streak(days) { let k = todayKey(), n = 0; if (!days[k]) k = prevDay(k); while (days[k]) { n++; k = prevDay(k); } return n; }
const playedDays = (s) => new Set([...Object.keys(s.days), ...Object.keys(s.adays)]).size;
const solvedAll = (s) => Object.values(s.dex).reduce((a, b) => a + (+b || 0), 0);
// 取りこぼした日：今日より前の7日のうち、今日の5問もあとからも遊んでいない日（新しい順。第1回より前は無い）
const LATE = 7;
function lateDays(s, k = todayKey()) { const out = []; let d = k; for (let i = 0; i < LATE; i++) { d = prevDay(d); if (d < EPOCH) break; if (!s.days[d] && !s.adays[d]) out.push(d); } return out; }

// ---- 実績：いまの記録から毎回数える（新しく残すのは結果で知らせ終えた印 ach だけ）。[id, 名前, 条件, 種類, 数え方, 目標] ----
function tally(s) {
  const dk = Object.values(s.days).filter((r) => r && Array.isArray(r.m));
  return { days: Object.keys(s.days).length, played: playedDays(s), clean: dk.filter((r) => r.m.length && r.m.every((m) => m === 0)).length, hard: Object.keys(s.hdays).length,
    late: Object.keys(s.adays).length, kinds: Object.keys(s.dex).filter((k) => G.BY[k] && s.dex[k] > 0).length, solved: solvedAll(s), ebest: s.ebest || 0 };
}
const ACH = [
  ["clean1", "一目で読める", "今日の5問を、まちがいもヒントもなしで解く", 0, "clean", 1],
  ["clean5", "和暦名人", "まちがいなしの日を5日", 0, "clean", 5],
  ["hard1", "むずかしい3問", "上級の3問を解く", 0, "hard", 1],
  ["hard10", "上級の常連", "上級を10日解く", 0, "hard", 10],
  ["e10", "とことん10問", "とことんの1回で、一度で正解を10問", 0, "ebest", 10],
  ["e30", "とことん30問", "とことんの1回で、一度で正解を30問", 0, "ebest", 30],
  ["k5", "和暦帳5ページ", "和暦帳に5種類", 1, "kinds", 5],
  ["kall", "和暦帳ぜんぶ", `和暦帳の${G.KINDS.length}種類を全部集める`, 1, "kinds", G.KINDS.length],
  ["s100", "100問", "解いた問題が合わせて100問", 1, "solved", 100],
  ["first", "はじめの1日", "今日の5問を解く", 2, "days", 1],
  ["p7", "7日", "遊んだ日が合わせて7日", 2, "played", 7],
  ["p30", "30日", "遊んだ日が合わせて30日", 2, "played", 30],
  ["late1", "あとから1日", "取りこぼした日をあとから遊ぶ", 2, "late", 1],
];
const AGRP = ["腕前", "集める", "続ける"];
const AUNIT = { clean: "日", hard: "日", days: "日", played: "日", late: "日", kinds: "種類", solved: "問", ebest: "問" };
const achGot = (s) => { const t = tally(s); return ACH.filter((a) => t[a[4]] >= a[5]).map((a) => a[0]); };
// あと少しの実績：まだの実績のうち、いちばん目標に近いもの1つ（ゴールに近いほど人はがんばる。Kivetz ほか 2006）
function nextAch(s) {
  const t = tally(s); let best = null;
  for (const a of ACH) { const n = t[a[4]]; if (n <= 0 || n >= a[5]) continue; const r = n / a[5], left = a[5] - n; if (!best || r > best.r || (r === best.r && left < best.left)) best = { id: a[0], name: a[1], left, unit: AUNIT[a[4]] || "", r }; }
  return best;
}

  app.innerHTML = `<header><button class="icon" id="back" aria-label="もどる">←</button><h1>練習<small>今日の記録には入りません（和暦帳には載ります）</small></h1></header>

function startRun(mode, opt) {
  const k = todayKey(); let ng = false;
  save((s) => {
    // あとから：取りこぼした日（過去7日・まだ遊んでいない）だけ。その日の今日の5問と同じ問題。途中経過は日付ごとに runs["a:日付"]
    if (mode === "a") {
      const ra = s.runs[runKey("a", opt)];
      if (!lateDays(s, k).includes(opt)) { ng = true; return; } // 期限は続きからより先に確かめる
      if (ra && ra.date === opt && !doneOf(ra)) return;
      s.runs[runKey("a", opt)] = { mode, date: opt, list: G.dailyTags(opt), res: [], cur: null, id: "a" + opt, a0: achGot(s) };
      return;
    }
    if (mode === "e") { const re = s.runs.e; if (re && !doneOf(re) && !re.over) return; s.runs.e = { mode, date: k, list: endlessList(), res: [], cur: null, id: rid(), a0: achGot(s) }; return; }
    if (mode !== "p" && s.runs[mode] && s.runs[mode].date === k) return; // 続きから
    if ((mode === "d" && s.days[k]) || (mode === "h" && s.hdays[k])) return; // 別のタブで今日の分を終えていたら、もう一度は始めない
    let list;
    if (mode === "d" || mode === "h") list = listOf(mode, k);
    else if (typeof opt === "string") list = randomTags(0, 5, rid(), new Set(), opt);
    else list = randomTags(opt, 5, rid());
    s.runs[mode] = { mode, date: k, list, res: [], cur: null, id: rid(), a0: achGot(s) };
  });
  if (ng) return cal();
  MODE = runKey(mode, opt);
  play();
}

// 今の1問：{ i, date, id, tag, P(問題), wrong:[選んだまちがい], hints, done }
let cur = null;
const same = (r) => r && cur && r.date === cur.date && r.id === cur.id && r.res.length === cur.i && r.list[cur.i] === cur.tag; // 保存した進み具合が、この画面と同じ問題か
// 途中の保存：別のタブで使ったヒント・まちがいも減らさない（多いほう・合わせたほうを残す）
function keep() { save((s) => { const r = s.runs[MODE]; if (!same(r)) return; const was = r.cur && r.cur.i === cur.i && r.cur.tag === cur.tag ? r.cur : { wrong: [], hints: 0 }; cur.hints = Math.max(cur.hints, was.hints || 0); for (const w of was.wrong || []) if (!cur.wrong.includes(w)) cur.wrong.push(w); r.cur = { i: cur.i, tag: cur.tag, wrong: cur.wrong.slice(), hints: cur.hints }; }); }
const missOf = () => cur.wrong.length + cur.hints;
function play() {
  const s = load(), run = s.runs[MODE];
  if (!run) return home();
  if (run.mode === "e" && !run.over && run.list.length - run.res.length < 10) { save((s2) => { const r = s2.runs.e; if (r && r.id === run.id && r.list.length === run.list.length) r.list.push(...moreList(r)); }); return play(); } // とことんは終わらない
  const i = run.res.length;
  if (i >= run.list.length || (run.mode === "e" && run.over)) return finish();
  if (run.mode === "a" && s.days[run.date]) { save((s2) => { s2.runs[MODE] = null; }); toast("この日は別の画面で遊び終えています"); return home(); }
  const tag = run.list[i], P = G.make(tag), hard = run.mode === "h";
  const saved = run.cur && run.cur.i === i && run.cur.tag === tag ? run.cur : { wrong: [], hints: 0 };
  cur = { i, date: run.date, id: run.id, tag, P, wrong: (saved.wrong || []).filter((w) => P.opts.includes(w) && w !== P.ans), hints: saved.hints || 0, done: false };
  const label = run.mode === "d" ? LV[P.lv] : run.mode === "a" ? `あとから・${LV[P.lv]}` : hard ? "上級" : run.mode === "e" ? `とことん・${LV[P.lv]}` : `練習・${LV[P.lv]}`;

  app.innerHTML = `
    <header><button class="icon" id="back" aria-label="もどる">←</button>
      ${run.mode === "e" ? `<span style="font-size:.8rem;color:var(--ink2)" id="eprog">${label} ${i + 1}問目・一度で正解 ${cleanOf(run)}${s.ebest ? `（ベスト ${s.ebest}）` : ""}</span>`
        : `<div class="dots" aria-label="${i + 1}問目／${run.list.length}問">${run.list.map((_, j) => `<i class="${j < i ? "done" : j === i ? "on" : ""}"></i>`).join("")}</div><span style="font-size:.8rem;color:var(--ink2)">${label} ${i + 1}/${run.list.length}</span>`}
    </header>
    <div class="pad" id="qpad">${sceneHtml(P)}</div>
    <div class="choices" id="choices" data-a11y-say>${P.opts.map((t, j) => `<button class="ch" data-j="${j}">${esc(t)}</button>`).join("")}</div>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
    <div id="hintbox"></div>
    ${hard ? "" : `<button class="sub" id="hint">ヒント</button>`}
    ${run.mode === "e" ? `<p class="note">まちがえても、ヒントを使っても続きます。やめたいときに降りられます。</p><button class="sub" id="quit">ここで降りる（${i}問で終える）</button>` : ""}
    <div id="after"></div>`;
  $("back").onclick = home;
  document.querySelectorAll(".ch").forEach((b) => (b.onclick = () => choose(+b.dataset.j)));
  if ($("hint")) $("hint").onclick = hint;
  if ($("quit")) $("quit").onclick = () => { if (cur && cur.done) return; save((s2) => { const r = s2.runs.e; if (r && r.id === run.id) r.over = true; }); finish(); };
  paint();
  toTop();
}
// ヒント2：まちがいの選び肢を消して、2つまでにしぼる（消す順は選び肢の並びの順）
const cutOf = () => { if (cur.hints < 2) return []; const left = cur.P.opts.filter((t) => t !== cur.P.ans && !cur.wrong.includes(t)); return left.slice(0, Math.max(0, left.length - 1)); };
function paint() {
  const cut = cutOf();
  document.querySelectorAll(".ch").forEach((b) => { const t = cur.P.opts[+b.dataset.j], ng = cur.wrong.includes(t) || cut.includes(t); b.classList.toggle("ng", ng); b.disabled = ng || cur.done; if (ng) b.setAttribute("aria-label", t + "（ちがう）"); });
  const h = $("hint"); if (h) h.disabled = cur.done || cur.hints >= 2;
  $("hintbox").innerHTML = cur.hints && !cur.done ? `<div class="hint" role="status">💡 ${esc(cur.P.look)}${cur.hints >= 2 ? "<br>💡 ちがう選び肢を消しました。のこりは2つです。" : ""}</div>` : "";
}
function hint() {
  if (cur.done || cur.hints >= 2) return;
  cur.hints++; keep(); paint();
}
function choose(j) {
  if (cur.done) return;
  const t = cur.P.opts[j];
  if (!same(load().runs[MODE])) { toast("別の画面で先に進んでいます"); return play(); }
  if (t !== cur.P.ans) {
    if (cur.wrong.includes(t)) return;
    buzz(40);
    cur.wrong.push(t); keep(); paint();
    $("msg").className = "msg bad"; $("msg").textContent = "✕ ちがいます。もう一度どうぞ。";
    return;
  }
  // 正解
  cur.done = true; buzz([10, 40, 10]);
  const m = missOf(), st = starsOf(m), P = cur.P;
  const s = save((s) => { const r = s.runs[MODE]; if (!same(r)) return; r.res.push({ m }); r.cur = null; s.dex[P.kind] = (s.dex[P.kind] || 0) + 1; });
  const r = s.runs[MODE], fin = r && r.res.length >= r.list.length;
  document.querySelectorAll(".ch").forEach((b) => { b.disabled = true; if (P.opts[+b.dataset.j] === P.ans) b.classList.add("ok"); });
  if ($("hint")) $("hint").disabled = true;
  $("hintbox").innerHTML = ""; $("msg").className = "msg"; $("msg").textContent = "";
  $("after").innerHTML = `<div class="verdict" role="status">
    <div class="hd">✓ 正解！ ${starStr(st)}</div>
    <p class="why"><b>なぜ：</b>${esc(P.why)}</p>${srcHtml(P)}
    <button class="main ok" id="next">${fin ? "結果を見る" : "次の問題へ"}</button></div>`;
  $("next").onclick = play;
  setTimeout(() => { if ($("next") && cur && cur.done && cur.tag === P.tag) $("next").scrollIntoView({ behavior: window.A11y && A11y.on("calm") ? "instant" : "smooth", block: "nearest" }); }, 60);
}

function finish() {
  const s = load(), run = s.runs[MODE];
  if (!run) return home();
  if (run.mode === "e") return endFinish(run);
  let first = false, newAch = [];
  const rec = recOf(run);
  save((s2) => {
    first = bank(s2, run);
    const c = s2.runs[MODE]; if (c && c.date === run.date && c.id === run.id) s2.runs[MODE] = null; // 別のタブで新しい回が始まっていたら、それは消さない
    if (Array.isArray(run.a0)) newAch = achGot(s2).filter((id) => !run.a0.includes(id) && !s2.ach[id]);
    for (const id of newAch) s2.ach[id] = 1;
  });
  if (run.mode === "p") return result("p", run.date, false, { list: run.list, ...rec }, newAch);
  result(run.mode, run.date, first, null, newAch);
}
// とことんの終わり：解いた数を自己ベストと比べる（他の人との順位は出さない）
function endFinish(run) {

  const s = load(), best = n > prev && n > 0;
  app.innerHTML = `
    <header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>和暦よみ<small>とことん</small></h1></header>
    <p class="big" id="eres">${all}問 解きました</p>
    <p class="note" id="eclean">一度で正解 ${n}問・まちがい ${run.res.reduce((a, x) => a + x.m, 0)}回（ヒントを含む）</p>
    <p class="note" id="ebest">${best ? "🎉 自己ベスト更新！" : `自己ベスト 一度で正解${s.ebest}問${s.ebest > n ? `（あと${s.ebest - n + 1}問で更新）` : ""}`}</p>
    ${newAch.length ? `<p class="achnew" id="achnew">${newAch.map((id) => `🏅 実績：${ACH.find((a) => a[0] === id)[1]}`).join("<br>")}</p>` : ""}
    <button class="main" id="go-e">もう一度とことん</button>
    <div class="row"><button class="sub" id="go-p">練習する</button><button class="sub" id="go-dex">和暦帳を見る</button></div>
    <p class="note"><a href="${FEEDBACK}" target="_blank" rel="noopener">感想を送る</a></p>`;
  $("back").onclick = home; $("go-e").onclick = () => startRun("e"); $("go-p").onclick = practiceMenu; $("go-dex").onclick = book;
  toTop();
}
// 共有の文：問題と答えは出さない。まちがい＋ヒントの数で色と形を変える（色だけで分けない）
const sq = (m) => (m === 0 ? "🟢" : m === 1 ? "🔶" : "🔺");
function shareText(mode, k, rec) { return `和暦よみ${mode === "h" ? " 上級" : ""} 第${dayNo(k)}回 ${md(k)}\n${rec.m.map(sq).join("")}${rec.m.every((m) => m === 0) ? " まちがいなし" : ""}`; }
function untilNext() { const n = jstNow(), ms = 864e5 - (n.getTime() % 864e5); return `${Math.floor(ms / 36e5)}時間${Math.floor((ms % 36e5) / 6e4)}分`; }
function result(mode, k, first, prec, newAch = []) {
  const s = load(), rec = mode === "p" ? prec : bookOf(s, mode)[k];
  if (!rec) return home();
  const list = mode === "p" ? prec.list : listOf(mode, k), total = rec.m.reduce((a, b) => a + b, 0), late = mode === "a", text = shareText(mode, k, rec);
  const showKofi = first && mode !== "p" && !late && total === 0 && !s.kofi[k + mode]; // あとから・練習・まちがいのある日には出さない
  if (showKofi) save((s2) => { s2.kofi[k + mode] = 1; });
  app.innerHTML = `
    <header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>和暦よみ<small>${mode === "d" ? `今日の5問 第${dayNo(k)}回` : late ? `第${dayNo(k)}回 あとから` : mode === "h" ? "上級" : "練習"}</small></h1></header>
    <p class="big">${total === 0 ? "全部まちがいなし！" : `${list.length}問 解きました`}</p>
    ${newAch.length ? `<p class="achnew" id="achnew">${newAch.map((id) => `🏅 実績：${ACH.find((a) => a[0] === id)[1]}`).join("<br>")}</p>` : ""}
    ${(() => { const nx = nextAch(s); return nx ? `<p class="achnext" id="achnext">🎯 あと${nx.left}${nx.unit}で「${nx.name}」</p>` : ""; })()}
    <div class="rlist">${list.map((tag, j) => { const P = G.make(tag); return `<div><span>${starStr(starsOf(rec.m[j]))}</span><span class="w"><b>${esc(P.name)}</b>${esc(P.ans)}</span></div>`; }).join("")}</div>
    ${late ? `<p class="note">あとから遊んだ日は、カレンダーに ↺ で残ります（続けた日には数えません）。</p><button class="main alt" id="go-cal">カレンダーへ</button>` : ""}
    ${mode !== "p" && !late ? `<div class="share">${esc(text)}</div>
    <button class="main" id="share">結果をシェア</button>
    <div class="shares"><a id="toX" target="_blank" rel="noopener">Xで投稿</a><a id="toLine" target="_blank" rel="noopener">LINEで送る</a><button id="copy">コピー</button></div>
    <p class="note">🟢まちがいなし　🔶1回　🔺2回以上<br>次の5問まで あと <b>${untilNext()}</b></p>` : ""}
    ${mode !== "p" ? `<button class="main alt" id="go-e">続けて遊ぶ：とことん${s.ebest ? `（ベスト ${s.ebest}問）` : ""}</button>` : ""}
    ${mode === "d" && k === todayKey() && !s.hdays[k] ? `<button class="main alt" id="go-h">上級：むずかしい3問に挑む</button>` : ""}
    <div class="row"><button class="sub" id="go-p">練習する</button><button class="sub" id="go-dex">和暦帳を見る</button></div>
    ${showKofi ? `<p class="note kofi">楽しめたら、<a href="https://ko-fi.com/satouaaaaa" target="_blank" rel="noopener">Ko-fi でコーヒー1杯の応援</a>をもらえると、新しいゲームづくりの励みになります（任意・遊ぶのはずっと無料）。</p>` : ""}
    <p class="note"><a href="${FEEDBACK}" target="_blank" rel="noopener">感想を送る</a></p>`;
  $("back").onclick = home; $("go-p").onclick = practiceMenu; $("go-dex").onclick = book;
  if ($("go-e")) $("go-e").onclick = () => startRun("e");
  if ($("go-h")) $("go-h").onclick = () => (k === todayKey() ? startRun("h") : home());
  if ($("go-cal")) $("go-cal").onclick = () => cal(k.slice(0, 7));
  if (mode !== "p" && !late) {
    const withUrl = text + "\n" + SITE;
    $("toX").href = "https://twitter.com/intent/tweet?text=" + encodeURIComponent(withUrl);
    $("toLine").href = "https://line.me/R/share?text=" + encodeURIComponent(withUrl);
    const copy = (t) => { (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast("コピーしました"), () => toast("コピーできませんでした")); };
    $("copy").onclick = () => copy(withUrl);
    $("share").onclick = () => { if (navigator.share) navigator.share({ text: withUrl }).catch(() => {}); else copy(withUrl); };
  }
  toTop();
}

// 和暦帳：解いた種類の「覚えること」が集まる。押すと、その種類だけで練習
function book() {
  const s = load(), n = G.KINDS.filter((k) => s.dex[k.id] > 0).length;
  app.innerHTML = `
    <header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>和暦帳<small>${n}/${G.KINDS.length}種類</small></h1></header>
    <p class="note">解いた種類の「覚えること」が集まります。押すと、その種類だけで5問練習できます。</p>
    ${LV.map((l, lv) => `<p class="agrp">${l}</p><div class="book">${G.KINDS.filter((k) => k.lv === lv).map((k) => s.dex[k.id] > 0 ? `<button data-k="${k.id}"><span class="mk" aria-hidden="true">📅</span><span><b>${esc(k.name)}</b><br><small class="nt">${esc(k.note)}</small></span><span class="ct">${s.dex[k.id]}問</span></button>` : `<span class="no" role="img" aria-label="まだ解いていない種類"><span class="mk" aria-hidden="true">？</span><span>まだ</span><span class="ct"></span></span>`).join("")}</div>`).join("")}
    <p class="agrp">和暦の早見</p>
    <div class="symlist" id="table">${G.TABLE.map(([h, xs]) => `<div><b>${esc(h)}</b>${xs.map(esc).join("<br>")}</div>`).join("")}</div>
    <p class="note">${["H", "R", "K", "A"].map((x) => srcHtml({ src: x })).join("")}</p>
    ${footer()}`;
  $("back").onclick = home;
  document.querySelectorAll(".book button").forEach((b) => (b.onclick = () => startRun("p", b.dataset.k)));
  bindFooter(); toTop();
}
function achView() {
  const s = load(), t = tally(s), got = achGot(s);
  app.innerHTML = `
    <header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>実績<small>${got.length}/${ACH.length}</small></h1></header>
    ${AGRP.map((g, gi) => `<p class="agrp">${g}</p><div class="alist">${ACH.filter((a) => a[3] === gi).map((a) => { const ok = got.includes(a[0]), n = Math.min(t[a[4]], a[5]); return `<div class="ach${ok ? " got" : ""}" data-id="${a[0]}"><span class="ic" aria-hidden="true">🏅</span><b>${ok ? "✓ " : ""}${a[1]}</b><span class="pg">${ok ? "達成" : `${n}/${a[5]}`}</span><small>${a[2]}</small>${ok ? "" : `<span class="bar"><i style="width:${Math.round((n / a[5]) * 100)}%"></i></span>`}</div>`; }).join("")}</div>`).join("")}
    ${footer()}`;
  $("back").onclick = home; bindFooter(); toTop();
}
// 遊んだ日のカレンダー：今日の5問の日は★（まちがいの少なさ）、あとから遊んだ日は ↺、取りこぼした過去7日は押すとあとから遊べる
const ymOf = (k) => k.slice(0, 7);
const ymAdd = (ym, n) => { const d = new Date(Date.UTC(+ym.slice(0, 4), +ym.slice(5, 7) - 1 + n, 1)); return d.toISOString().slice(0, 7); };
const lvOf = (rec) => { const t = rec && Array.isArray(rec.m) ? rec.m.reduce((a, b) => a + b, 0) : 9; return t === 0 ? 3 : t <= 2 ? 2 : 1; };
function cal(ym) {
  const s = load(), k = todayKey(), late = lateDays(s, k), st = streak(s.days);
  if (!ym || ym > ymOf(k)) ym = ymOf(k);
  if (ym < ymOf(EPOCH)) ym = ymOf(EPOCH);
  const y = +ym.slice(0, 4), m = +ym.slice(5, 7), dow = new Date(Date.UTC(y, m - 1, 1)).getUTCDay(), n = new Date(Date.UTC(y, m, 0)).getUTCDate(), cells = [];
  for (let i = 0; i < dow; i++) cells.push(`<span class="c off"></span>`);
  for (let d = 1; d <= n; d++) {
    const key = `${ym}-${String(d).padStart(2, "0")}`, rec = s.days[key], ar = s.adays[key], hd = s.hdays[key] ? `<span class="hd">上</span>` : "";
    if (rec) { const lv = lvOf(rec); cells.push(`<span class="c p${lv}" data-k="${key}" role="img" aria-label="${m}月${d}日 星${lv}つ">${d}<i>${"★".repeat(lv)}</i>${hd}</span>`); }
    else if (ar) cells.push(`<span class="c late" data-k="${key}" role="img" aria-label="${m}月${d}日 あとから遊んだ">${d}<i>↺</i></span>`);
    else if (late.includes(key)) { const go = s.runs[runKey("a", key)]; cells.push(`<button class="c miss" data-k="${key}" aria-label="${m}月${d}日をあとから遊ぶ${go ? "（続きから）" : ""}">${d}<i>${go ? "続き" : "▶"}</i></button>`); }
    else cells.push(`<span class="c${key === k ? " today" : ""}" data-k="${key}">${d}</span>`);
  }
  const pd = playedDays(s);
  app.innerHTML = `<header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>カレンダー${pd ? `<small>合わせて ${pd}日${st >= 1 ? `・続けて ${st}日` : ""}</small>` : ""}</h1></header>
    <div class="calnav"><button class="sub" id="prev" aria-label="前の月"${ym <= ymOf(EPOCH) ? " disabled" : ""}>‹</button><b>${y}年${m}月</b><button class="sub" id="next" aria-label="次の月"${ym >= ymOf(k) ? " disabled" : ""}>›</button></div>
    <div class="cal">${["日", "月", "火", "水", "木", "金", "土"].map((w) => `<span class="wd">${w}</span>`).join("")}${cells.join("")}</div>
    <div class="legend"><span><em style="background:var(--ai)"></em>★★★ まちがいなし</span><span><em style="background:#d5e1f3"></em>★★ 1〜2回</span><span>↺ あとから</span><span>上 上級</span></div>
    ${late.length ? `<p class="note">▶ の日は、その日の5問をあとから遊べます（過去7日まで・続けた日には数えません）。</p>` : ""}
    ${footer()}`;
  $("back").onclick = home; $("prev").onclick = () => cal(ymAdd(ym, -1)); $("next").onclick = () => cal(ymAdd(ym, 1));
  document.querySelectorAll(".cal .miss").forEach((b) => (b.onclick = () => (lateDays(load()).includes(b.dataset.k) ? startRun("a", b.dataset.k) : cal(ym))));
  bindFooter(); toTop();
}

window.__bs = { keysOf, mode: () => MODE, load, save, todayKey, dayNo, lateDays, ACH, achGot, nextAch, tally, shareText, streak, endlessList, moreList, ERAMP, TIPS, cur: () => cur, play: (m) => { if (m) MODE = m; play(); }, home, cal, book, about, EPOCH, KEY, G };
